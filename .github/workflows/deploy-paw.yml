
name: Deploy PAW

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Build Frontend
      - name: Build Frontend
        working-directory: pcapng-analyzer-frontend
        run: |
          set -e
          npm ci
          npm run build

      # 3. Upload Project
      - name: Upload Project
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "."
          target: "/var/www/paw"

      # 4. Compile Ubuntu Engine
      - name: Compile Ubuntu Engine
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 30m
          script: |
            set -Eeuo pipefail

            ENGINE_DIR="/var/www/paw/pcapng-analyzer-engine"
            BACKEND_DIR="/var/www/paw/pcapng-analyzer-backend"
            OUTPUT="$BACKEND_DIR/cli/main.exe"

            echo "=== Installing dependencies ==="

            export DEBIAN_FRONTEND=noninteractive
            sudo apt-get update
            sudo apt-get install -y build-essential libpcap-dev

            echo "=== Preparing output directory ==="

            mkdir -p "$BACKEND_DIR/cli"

            cd "$ENGINE_DIR"

            echo "=== Compiling PAW Ubuntu engine ==="

            gcc \
              src/main.c \
              src/parsing/pcapng_parser.c \
              src/parsing/packet_parser.c \
              src/parsing/shb_parser.c \
              src/parsing/idb_parser.c \
              src/parsing/epb_parser.c \
              src/parsing/nrb_parser.c \
              src/parsing/isb_parser.c \
              src/parsing/pb_parser.c \
              src/parsing/spb_parser.c \
              src/parsing/ethernet_parser.c \
              src/parsing/ipv4_parser.c \
              src/parsing/ipv6_parser.c \
              src/parsing/protocol_parser.c \
              src/validation/pcapng_validation.c \
              src/validation/packet_validation.c \
              src/core/protocol_node.c \
              src/utils/endianness.c \
              src/utils/debug.c \
              src/utils/utils.c \
              src/export/json_export.c \
              src/analysis/flow.c \
              src/analysis/flow_output.c \
              -Wall -Wextra -Wpedantic \
              -Isrc \
              -Isrc/parsing \
              -Isrc/pcapng \
              -Isrc/core \
              -Isrc/utils \
              -Isrc/validation \
              -Isrc/export \
              -Isrc/analysis \
              -Isrc/packets \
              -o "$OUTPUT" \
              -lpcap

            echo "=== Verifying executable ==="

            chmod +x "$OUTPUT"

            test -x "$OUTPUT"

            file "$OUTPUT"
            ldd "$OUTPUT"

            echo "=== Ubuntu engine compiled successfully ==="

            ls -lh "$OUTPUT"

      # 5. Install Backend Dependencies
      - name: Install Backend Dependencies
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 10m
          script: |
            set -Eeuo pipefail

            cd /var/www/paw/pcapng-analyzer-backend

            echo "=== Installing backend dependencies ==="

            npm install --production

            echo "=== Checking engine ==="

            test -x cli/main.exe

            echo "=== Restarting PAW ==="

            pm2 restart paw || pm2 start server.js --name paw

            pm2 status paw

            echo "=== Deployment complete ==="
