
name: Deploy PAW

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Build frontend
      - name: Build Frontend
        working-directory: pcapng-analyzer-frontend
        run: |
          set -Eeuo pipefail

          echo "=== Installing frontend dependencies ==="
          npm ci

          echo "=== Building frontend ==="
          npm run build

          echo "=== Frontend build complete ==="

      # 3. Upload project to Ubuntu
      - name: Upload Project
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "."
          target: "/var/www/paw"

      # 4. Compile C engine for Ubuntu
      - name: Compile Ubuntu Engine
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 30m
          script: |
            set -Eeuo pipefail

            trap 'echo "ERROR: Build failed at line $LINENO"' ERR

            ENGINE_DIR="/var/www/paw/pcapng-analyzer-engine"
            BACKEND_DIR="/var/www/paw/pcapng-analyzer-backend"
            OUTPUT="$BACKEND_DIR/cli/main.exe"

            echo "======================================"
            echo "PAW UBUNTU ENGINE COMPILATION"
            echo "======================================"

            # Install compiler dependencies
            echo "=== Installing dependencies ==="

            export DEBIAN_FRONTEND=noninteractive

            sudo apt-get update
            sudo apt-get install -y build-essential libpcap-dev

            # Check engine directory
            echo "=== Checking engine directory ==="

            if [ ! -d "$ENGINE_DIR/src" ]; then
              echo "ERROR: Engine source directory not found"
              exit 1
            fi

            mkdir -p "$BACKEND_DIR/cli"

            cd "$ENGINE_DIR"

            # Find all C source files
            echo "=== Finding C source files ==="

            mapfile -t SOURCE_FILES < <(
              find src -type f -name "*.c" | sort
            )

            if [ "${#SOURCE_FILES[@]}" -eq 0 ]; then
              echo "ERROR: No C source files found"
              exit 1
            fi

            echo "Found ${#SOURCE_FILES[@]} C files"

            # Find all header directories
            echo "=== Finding header directories ==="

            INCLUDE_FLAGS=()

            while IFS= read -r directory; do
              INCLUDE_FLAGS+=("-I$directory")
            done < <(find src -type d | sort)

            # Compile engine
            echo "=== Compiling engine ==="

            gcc \
              -std=c11 \
              -O2 \
              -Wall \
              -Wextra \
              "${INCLUDE_FLAGS[@]}" \
              "${SOURCE_FILES[@]}" \
              -o "$OUTPUT" \
              -lpcap

            # Verify executable
            echo "=== Verifying executable ==="

            chmod +x "$OUTPUT"

            if [ ! -x "$OUTPUT" ]; then
              echo "ERROR: Executable was not created"
              exit 1
            fi

            file "$OUTPUT"

            echo "=== Checking shared libraries ==="
            ldd "$OUTPUT"

            echo "======================================"
            echo "ENGINE COMPILATION SUCCESSFUL"
            echo "======================================"

            ls -lh "$OUTPUT"

      # 5. Install backend dependencies
      - name: Install Backend Dependencies
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 10m
          script: |
            set -Eeuo pipefail

            cd /var/www/paw/pcapng-analyzer-backend

            echo "=== Installing backend dependencies ==="

            npm install --production

            echo "=== Checking engine executable ==="

            test -x cli/main.exe

            file cli/main.exe

            echo "=== Restarting PAW ==="

            pm2 restart paw || pm2 start server.js --name paw

            echo "=== PM2 status ==="

            pm2 status paw

            echo "======================================"
            echo "PAW DEPLOYMENT COMPLETE"
            echo "======================================"
