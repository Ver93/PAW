
name: Deploy PAW

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Frontend
        working-directory: pcapng-analyzer-frontend
        run: |
          npm ci
          npm run build

      - name: Upload Project
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "."
          target: "/var/www/paw"

      - name: Compile Ubuntu Engine
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e

            ENGINE_DIR="/var/www/paw/pcapng-analyzer-engine"
            BACKEND_DIR="/var/www/paw/pcapng-analyzer-backend"
            OUTPUT="$BACKEND_DIR/cli/main.exe"

            sudo apt-get update
            sudo apt-get install -y build-essential libpcap-dev

            mkdir -p "$BACKEND_DIR/cli"

            cd "$ENGINE_DIR"

            echo "Compiling Ubuntu engine..."

            gcc -O2 -Wall -Wextra \
              $(find src -type f -name "*.c") \
              -o "$OUTPUT" \
              -lpcap

            chmod +x "$OUTPUT"

            test -x "$OUTPUT"
            file "$OUTPUT"

            echo "Ubuntu engine compiled successfully."

      - name: Install Backend Dependencies and Restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e

            cd /var/www/paw/pcapng-analyzer-backend

            npm install --production

            pm2 restart paw || pm2 start server.js --name paw

            echo "PAW deployment complete."
